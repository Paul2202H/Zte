
name: ZTE Family Toolbox - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_SETTINGS=$(find . \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "::error::No Gradle settings file found."
            echo "Check that the Android project was uploaded."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Validate Gradle project
        run: |
          gradle -p "$PROJECT_DIR" tasks \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Family-Toolbox-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gradle -p "$PROJECT_DIR" assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Family-Toolbox-Release-APK
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
          retention-days: 14
