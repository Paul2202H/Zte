name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle project
        run: gradle --no-daemon tasks

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Decode optional release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release-signing.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; Gradle will produce an unsigned release APK."
          fi

      - name: Build release APK (signed when secrets are configured)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare APK artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG" ]; then
            echo "ERROR: Debug APK was not produced. Review the Gradle output." >&2
            exit 1
          fi
          cp "$DEBUG" artifacts/ZTE-Family-Toolbox-debug.apk
          RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$SIGNED" ]; then cp "$SIGNED" artifacts/ZTE-Family-Toolbox-release.apk; \
          elif [ -f "$RELEASE" ]; then cp "$RELEASE" artifacts/ZTE-Family-Toolbox-release-unsigned.apk; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Family-Toolbox-debug-APK
          path: artifacts/ZTE-Family-Toolbox-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK when produced
        if: hashFiles('artifacts/ZTE-Family-Toolbox-release*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Family-Toolbox-release-APK
          path: artifacts/ZTE-Family-Toolbox-release*.apk
          if-no-files-found: warn
          retention-days: 30
